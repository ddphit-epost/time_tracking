<!-- templates/base.html -->
<!-- القالب الأساسي الذي سيتم استخدامه في جميع الصفحات -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Tracking Hub</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome.css') }}">

    <!-- Local CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body>
    <aside class="sidebar">
        <nav class="navigation">
            <a href="#" class="logo">LOGO</a>
            <ul>
                <li><a href="{{ url_for('index') }}" class="nav-item"><i class="fa-solid fa-clock"></i><span>الموقت</span></a></li>
                <li><a href="{{ url_for('tasks') }}" class="nav-item"><i class="fa-solid fa-list-check"></i><span>المهام</span></a></li>
                <li><a href="{{ url_for('projects') }}" class="nav-item"><i class="fa-solid fa-folder-tree"></i><span>المشاريع</span></a></li>
                <li><a href="{{ url_for('reports') }}" class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>التقارير</span></a></li>
            </ul>
        </nav>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
