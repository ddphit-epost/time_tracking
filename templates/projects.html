{% extends "base.html" %}
{% block content %}
{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>إدارة المشاريع</h1>
</div>

<div class="card">
    <div class="card-header">
        <h3>إضافة مشروع جديد</h3>
    </div>
    <div class="card-body">
        <form id="add-project-form" class="form-inline">
            <input type="text" id="new-project-name" placeholder="اسم المشروع الجديد" required>
            <button type="submit" class="btn btn-primary">+ إضافة مشروع</button>
        </form>
    </div>
</div>

<div class="card-deck" id="projects-list">
    <!-- Project cards will be dynamically inserted here by projects.js -->
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/projects.js') }}"></script>
{% endblock %}

{% endblock %}
